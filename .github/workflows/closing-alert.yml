name: Closing Alert (09:00 KST)

# 매일 09:00 KST — 마감 임박 (D-3 이내) 공고를 구독자에게 메일 발송.
# 출근 직후 확인용. 신규/키워드 알림은 daily-collect 워크플로우에 포함.

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC = 09:00 KST
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  closing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      - run: pip install -r requirements.txt
      - name: 마감 임박 알림 발송
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SITE_URL: ${{ secrets.CLOUDTYPE_URL }}
        run: python -m scripts.send_alerts --kind closing
