name: Collect (07/12/18 KST)

# 매일 3회 자동 수집 — 07/12/18 KST.
# 신규 공고를 영업시간 내에 더 빠르게 반영.
# DATABASE_URL (Supabase Postgres) 에 직접 적재 — git commit 불필요.
#
# Secrets 등록 필요 (GitHub repo Settings → Secrets and variables → Actions):
#   - DATABASE_URL     (필수: Supabase Postgres connection string)
#   - G2B_SERVICE_KEY  (필수: 나라장터·누리장터·D2B·K-water 공용)
#   - LH_SERVICE_KEY   (필수: 한국토지주택공사, data.go.kr 15021183)
#   - KEPCO_API_KEY    (선택: 한전 KEPCO, bigdata.kepco.co.kr 별도 발급)

on:
  schedule:
    - cron: '0 22 * * *'  # 07:00 KST (UTC 22:00 전날) — 오전 업무 시작 전
    - cron: '0 23 * * *'  # 08:00 KST (UTC 23:00 전날) — 다이제스트 메일 발송
    - cron: '0 3 * * *'   # 12:00 KST (UTC 03:00)      — 점심 시점
    - cron: '0 9 * * *'   # 18:00 KST (UTC 09:00)      — 퇴근 무렵 / 당일 마감 캡처
  workflow_dispatch: {}    # 수동 트리거 가능 (Actions 탭에서 'Run workflow')

permissions:
  contents: read           # 더 이상 git push 안 함 (DB 가 직접 Supabase 로 가니까)

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collection (Postgres mode via DATABASE_URL)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          LH_SERVICE_KEY: ${{ secrets.LH_SERVICE_KEY }}
          # KEPCO_API_KEY 는 Python 에서 사용 안 함 (config.yaml kepco_api=false).
          # Cloudtype 프록시 단계 아래에서 KEPCO_API_KEY 가 사용됨.
        run: python main.py --collect-only

      - name: KEPCO 수집 (Cloudtype 프록시 — 해외 IP 차단 회피)
        # KEPCO 는 한국 IP 외 차단해서 GH Actions runner 가 직접 호출 불가.
        # Cloudtype (한국 region) 의 /api/collect-kepco 엔드포인트가
        # KEPCO API 호출 → Supabase 적재 처리.
        env:
          CLOUDTYPE_URL: ${{ secrets.CLOUDTYPE_URL }}
          COLLECT_SECRET: ${{ secrets.COLLECT_SECRET }}
        run: |
          if [ -z "$CLOUDTYPE_URL" ]; then
            echo "CLOUDTYPE_URL 미설정 — KEPCO 수집 skip"
            exit 0
          fi
          echo "→ POST ${CLOUDTYPE_URL%/}/api/collect-kepco"
          http_code=$(curl -s -o /tmp/kepco-resp.json -w "%{http_code}" \
            -X POST "${CLOUDTYPE_URL%/}/api/collect-kepco" \
            -H "X-Collect-Secret: $COLLECT_SECRET" \
            -H "X-Lookback-Days: 30" \
            --max-time 90)
          echo "← HTTP $http_code"
          cat /tmp/kepco-resp.json
          echo
          # 200 이 아니면 워크플로우 fail (다른 수집은 이미 끝났으니 부분 성공)
          if [ "$http_code" != "200" ]; then
            echo "::warning::KEPCO 수집 실패 (HTTP $http_code) — 다른 source 는 정상 적재됨"
            exit 1
          fi

      - name: 마감 지난 row 정리 (close_date < 오늘-7일, 영업대표 할당 제외)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/cleanup_old_bids.py
        continue-on-error: true   # 정리 실패해도 워크플로우 전체 fail 시키지 않음

      - name: 일일 다이제스트 메일 발송 (신규+키워드+마감 통합, 하루 1통)
        # 08시(UTC 23:00) 또는 수동 트리거 시에만 발송.
        # 07/12/18시 수집은 데이터만 갱신 (중복 메일 방지).
        if: github.event.schedule == '0 23 * * *' || github.event_name == 'workflow_dispatch'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SITE_URL: ${{ secrets.CLOUDTYPE_URL }}
          # SMTP (Gmail/Naver/사내) — SMTP_HOST 있으면 자동으로 SMTP 우선 사용
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # Resend 폴백 (SMTP 없을 때만) — 미설정이면 무시됨
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python -m scripts.send_alerts
        continue-on-error: true   # 발송 실패해도 수집 자체는 성공 처리

      - name: 관리자 운영 리포트 발송 (전일 방문/구독 현황 — 관리자 1명)
        # 08시 다이제스트와 동일 트리거. 구독자 알림과 별개로 ADMIN_EMAIL 에게만.
        if: github.event.schedule == '0 23 * * *' || github.event_name == 'workflow_dispatch'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SITE_URL: ${{ secrets.CLOUDTYPE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python -m scripts.send_admin_report
        continue-on-error: true
