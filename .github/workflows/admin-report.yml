name: Admin Report (08:00 KST)

# 관리자 일일 운영 리포트 — 전일 방문/체류/구독증감/이메일목록.
# ADMIN_EMAIL(기본 jihyeong.kim@kt.com) 에게만 발송.
#
# 수집(daily-collect)과 독립 워크플로우 — 수집 step 실패에 영향받지 않음.
# (관리자 리포트는 수집 데이터와 무관하게 항상 발송되어야 함)

on:
  schedule:
    - cron: '10 23 * * *'   # 08:10 KST (UTC 23:10) — 수집 다이제스트(08:00) 직후
  workflow_dispatch: {}     # 수동 트리거 (언제든 관리자 본인에게만 발송, 안전)

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      - run: pip install -r requirements.txt
      - name: 관리자 운영 리포트 발송
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SITE_URL: ${{ secrets.CLOUDTYPE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python -m scripts.send_admin_report
