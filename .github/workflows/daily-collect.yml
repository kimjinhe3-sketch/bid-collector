name: Daily Collect (18:00 KST)

# 매일 09:00 UTC = 18:00 KST 자동 수집.
# DATABASE_URL (Supabase Postgres) 에 직접 적재 — git commit 불필요.
#
# Secrets 등록 필요 (GitHub repo Settings → Secrets and variables → Actions):
#   - DATABASE_URL     (필수: Supabase Postgres connection string)
#   - G2B_SERVICE_KEY  (필수: 나라장터·누리장터·D2B·K-water 공용)
#   - LH_SERVICE_KEY   (필수: 한국토지주택공사, data.go.kr 15021183)
#   - KEPCO_API_KEY    (선택: 한전 KEPCO, bigdata.kepco.co.kr 별도 발급)

on:
  schedule:
    - cron: '0 9 * * *'   # 매일 09:00 UTC (= 18:00 Asia/Seoul)
  workflow_dispatch: {}    # 수동 트리거 가능 (Actions 탭에서 'Run workflow')

permissions:
  contents: read           # 더 이상 git push 안 함 (DB 가 직접 Supabase 로 가니까)

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collection (Postgres mode via DATABASE_URL)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          LH_SERVICE_KEY: ${{ secrets.LH_SERVICE_KEY }}
          KEPCO_API_KEY: ${{ secrets.KEPCO_API_KEY }}
        run: python main.py --collect-only

      - name: Warm Streamlit apps (선택 — 마이그레이션 완료 시 제거)
        run: |
          curl -fsSL --max-time 30 https://bidlivekorea.streamlit.app/      > /dev/null || true
          curl -fsSL --max-time 30 https://bidlivekorea-test.streamlit.app/ > /dev/null || true
