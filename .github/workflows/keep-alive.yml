name: Keep Cloudtype Alive

# Cloudtype Sandbox 무료 플랜은 15분 무활동 → sleep 모드 진입.
# 10분 간격 ping 으로 sleep 차단 → wakeup 비용 (30~60s) 절감 + 사용자 404 방지.
#
# 필요 Secret:
#   CLOUDTYPE_URL — Cloudtype 사이트 URL (예: https://port-next-bidlive-korea-web-xxx.cloudtype.app)
#                   미설정 시 step warning + skip — sleep 보호 안 됨.
#
# GH Actions 무료 한도: 2000분/월 (Private repo).
#   10분 cron × 0.5분 작업 × 144회/일 × 30일 = ~2160분 → 한도 살짝 초과.
#   bid-collector 를 Public 으로 전환하면 Actions 무제한.

on:
  schedule:
    - cron: '*/10 * * * *'   # 10분 간격
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Cloudtype
        env:
          CLOUDTYPE_URL: ${{ secrets.CLOUDTYPE_URL }}
        run: |
          if [ -z "$CLOUDTYPE_URL" ]; then
            echo "::warning::CLOUDTYPE_URL secret 미설정 — ping skip (sleep 보호 안 됨)"
            exit 0
          fi
          URL="${CLOUDTYPE_URL%/}/bids"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
                      -A "GH-Actions-KeepAlive" "$URL" || echo "000")
          echo "$(date -u +%FT%TZ) ping $URL → HTTP $code"
          # 응답 분류:
          #   200/304: 정상
          #   404:    배포 실패 (sleep 와 무관) — warning
          #   5xx:    서버 에러 — warning
          #   000:    timeout / DNS 실패 — warning
          # 어떤 응답이든 wakeup 신호는 전달했으니 step 자체는 성공으로 종료.
          case "$code" in
            200|304) ;;
            404)     echo "::warning::404 응답 — Cloudtype 배포 자체가 깨졌을 수 있음" ;;
            5*)      echo "::warning::5xx 응답 — 앱 런타임 에러 가능성" ;;
            *)       echo "::warning::응답 코드 $code — 네트워크/timeout 의심" ;;
          esac
          exit 0
